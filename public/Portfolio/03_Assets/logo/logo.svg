<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2018"/>
      <stop offset="60%" stop-color="#140f0c"/>
      <stop offset="100%" stop-color="#0a0806"/>
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="25%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="120" fill="url(#bgGlow)"/>
  
  <!-- Subtle Rim Border -->
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-opacity="0.4"/>
  <rect width="484" height="484" x="14" y="14" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Geometric Outer Rings -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.4"/>

  <!-- Corner Accents -->
  <g stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.5" fill="none">
    <path d="M 60 90 L 60 60 L 90 60" />
    <path d="M 422 60 L 452 60 L 452 90" />
    <path d="M 60 422 L 60 452 L 90 452" />
    <path d="M 422 452 L 452 452 L 452 422" />
  </g>

  <!-- Center Monogram "ES" / "ЕК" Stylized Monogram -->
  <g filter="url(#shadow)" transform="translate(0,0)">
    <!-- "E" letter in elegant serif / geometric style -->
    <path d="M 155 150 L 265 150 M 155 150 L 155 362 M 155 256 L 245 256 M 155 362 L 265 362" 
          fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
          
    <!-- "S" letter interlocking with E -->
    <path d="M 355 185 C 355 150 325 150 295 150 C 255 150 245 190 245 215 C 245 270 355 250 355 305 C 355 345 320 362 280 362 C 245 362 215 345 215 320" 
          fill="none" stroke="url(#goldGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Subtle Diamond Sparkle Top/Bottom -->
  <path d="M 256 72 L 262 90 L 280 96 L 262 102 L 256 120 L 250 102 L 232 96 L 250 90 Z" fill="url(#goldGrad)" opacity="0.8"/>
  <path d="M 256 392 L 262 410 L 280 416 L 262 422 L 256 440 L 250 422 L 232 416 L 250 410 Z" fill="url(#goldGrad)" opacity="0.8"/>

  <!-- Underline Accent -->
  <line x1="180" y1="390" x2="332" y2="390" stroke="url(#goldLight)" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <circle cx="256" cy="390" r="5" fill="url(#goldGrad)"/>
</svg>
